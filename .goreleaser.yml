# Release build for `fulcrum`.
#
# CGO IS OFF, which is what makes the matrix below buildable from one Linux
# runner: nothing here needs a C toolchain. go-keyring reaches the macOS
# keychain by shelling out to /usr/bin/security and the Linux one over pure-Go
# dbus, so the secret store still works in a static binary.
#
# The version is stamped into main.version, which cmd/fulcrum/main.go already
# reads — an unstamped build reports itself as "dev", and a colleague asking
# `fulcrum version` needs a real answer to know whether they are stale.
version: 2

project_name: fulcrum

# NO TEST RUN HERE, deliberately. CI already gates every push to main, so a
# tag points at a commit whose suite has passed; re-running it at release time
# buys nothing and makes shipping hostage to a flake. It did exactly that on
# the first attempt at v0.1.0: a timing-sensitive teatest in internal/tui
# timed out on the runner and failed the release, on a commit whose own CI run
# had passed minutes earlier — and by then the tag was already cut.
#
# `download` rather than `tidy`: tidy REWRITES go.mod and go.sum, so a release
# could ship a module graph that differs from the one CI verified.
before:
  hooks:
    - go mod download

builds:
  - id: fulcrum
    main: ./cmd/fulcrum
    binary: fulcrum
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: fulcrum
    formats: [ tar.gz ]
    # OS and arch spelled the way a person reads them, because this name ends
    # up in a curl command someone types.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# macOS only. Homebrew CASKS ARE NOT SUPPORTED ON LINUX — Linux installs come
# from install.sh, which reads the same release artifacts.
#
# A cask installs the PRE-BUILT binary. The existing headwayio tap builds from
# source and so needs a Go toolchain on the machine first; this is the
# difference between a colleague installing in ten seconds and installing a
# compiler.
homebrew_casks:
  - name: fulcrum
    # Per-tool tap, matching what the org already does (homebrew-tokenizer) and
    # what the README already tells people to type:
    #   brew install headwayio/fulcrum/fulcrum
    repository:
      owner: headwayio
      name: homebrew-fulcrum
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/headwayio/fulcrum-cli
    # No `license:` here on purpose. GoReleaser ACCEPTS the key and silently
    # drops it, because the Homebrew Cask DSL has no license stanza — that is a
    # formula thing. Verified by reading a generated cask, not by the config
    # validator, which passes it happily. The licence reaches users through the
    # LICENSE file shipped inside the archive.
    description: Fulcrum from your terminal, and for the coding harness you work in
    binaries: [ fulcrum ]
    hooks:
      post:
        install: |
          if OS.mac?
            # The binary is not notarised, so Gatekeeper quarantines anything
            # downloaded from the internet and the first run dies with "cannot
            # be opened because the developer cannot be verified" — which reads
            # like a broken install rather than a policy.
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/fulcrum"]
          end
